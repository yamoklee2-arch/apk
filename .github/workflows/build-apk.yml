name: Build SmartAlert TEST APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ZIP FILES ==="
          find . -type f -iname "*.zip" -print

          ZIP=$(find . -type f -iname "*.zip" -print -quit || true)

          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Unzip project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/smartalert-project"
          mkdir -p "$RUNNER_TEMP/smartalert-project"

          unzip -q "${{ steps.find_zip.outputs.zip_path }}" \
            -d "$RUNNER_TEMP/smartalert-project"

          echo "=== UNZIPPED PROJECT ==="
          find "$RUNNER_TEMP/smartalert-project" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          BASE="$RUNNER_TEMP/smartalert-project"
          PROJECT_ROOT=""

          echo "=== SEARCHING ANDROID PROJECT ==="

          while IFS= read -r -d '' FILE; do
            PROJECT_ROOT="$(dirname "$(dirname "$FILE")")"
            break
          done < <(
            find "$BASE" \
              -type f \
              -path "*/app/build.gradle.kts" \
              -print0
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android project root not found."

            echo "=== PROJECT FILES ==="
            find "$BASE" -maxdepth 6 -type f | sort

            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          cd "$PROJECT_ROOT"

          echo "=== PROJECT ROOT ==="
          pwd

          echo "=== PROJECT CONTENT ==="
          ls -la

          echo "=== SETTINGS ==="
          test -f settings.gradle.kts
          cat settings.gradle.kts

          echo "=== ROOT BUILD ==="
          test -f build.gradle.kts
          cat build.gradle.kts

          echo "=== APP BUILD ==="
          test -f app/build.gradle.kts
          cat app/build.gradle.kts

          echo "=== GRADLE PROPERTIES ==="
          test -f gradle.properties
          cat gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== PROJECT ==="
          pwd

          echo "=== GRADLE TASKS ==="
          gradle tasks \
            --stacktrace \
            --no-daemon

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "=== BUILD DEBUG APK ==="

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

          echo "=== APK FILES ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAlert-test-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
