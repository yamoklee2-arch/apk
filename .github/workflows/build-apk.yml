name: Build SmartAlert TEST APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          if [ -f "./smartalert-test.zip" ]; then
            ZIP="./smartalert-test.zip"
          else
            ZIP=$(find . -type f -name "smartalert-test.zip" -print -quit || true)
          fi

          if [ -z "$ZIP" ]; then
            while IFS= read -r -d '' candidate; do
              if unzip -l "$candidate" | grep -qE '(^|/)app/build\.gradle\.kts'; then
                ZIP="$candidate"
                break
              fi
            done < <(find . -type f -name "*.zip" -print0)
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::SmartAlert project ZIP not found."
            echo "ZIP files found:"
            find . -type f -name "*.zip" -print || true
            exit 1
          fi

          echo "ZIP=$ZIP"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Unzip project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/smartalert-project"
          mkdir -p "$RUNNER_TEMP/smartalert-project"

          unzip -q "${{ steps.find_zip.outputs.zip_path }}" \
            -d "$RUNNER_TEMP/smartalert-project"

          echo "=== ZIP CONTENT ==="
          find "$RUNNER_TEMP/smartalert-project" -maxdepth 4 -type f | sort | head -300

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          BASE="$RUNNER_TEMP/smartalert-project"

          PROJECT_ROOT=$(find "$BASE" \
            -type f \
            -path "*/app/build.gradle.kts" \
            -print -quit \
            | xargs -r dirname \
            | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ] || [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "::error::Android project root could not be detected."
            find "$BASE" -maxdepth 6 -type f | sort | head -500
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          cd "$PROJECT_ROOT"

          echo "=== PROJECT ROOT ==="
          pwd
          ls -la

          if [ ! -f "settings.gradle.kts" ]; then
            cat > settings.gradle.kts <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SmartAlert"
include(":app")
EOF
          fi

          if [ ! -f "build.gradle.kts" ]; then
            cat > build.gradle.kts <<'EOF'
plugins {
    alias(libs.plugins.android.application) apply false
}
EOF
          fi

          if [ ! -f "gradle.properties" ]; then
            cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOF
          fi

          echo "=== BUILD FILES ==="
          echo "--- settings.gradle.kts ---"
          cat settings.gradle.kts

          echo "--- build.gradle.kts ---"
          cat build.gradle.kts

          echo "--- gradle.properties ---"
          cat gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle project
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          gradle --version

          echo "=== Gradle tasks ==="
          gradle tasks --stacktrace --no-daemon

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "=== BUILD DEBUG APK ==="

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

          echo "=== APK OUTPUT ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAlert-test-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
