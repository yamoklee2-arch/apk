name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          echo "=== SEARCHING ZIP ==="

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Found ZIP:"
          echo "$ZIP_FILE"

      - name: Unzip project
        shell: bash
        run: |
          set -e

          WORK_DIR="$RUNNER_TEMP/smartalert-project"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          echo "=== UNZIPPING PROJECT ==="
          echo "ZIP: $ZIP_FILE"
          echo "DEST: $WORK_DIR"

          unzip -q "$ZIP_FILE" -d "$WORK_DIR"

          echo
          echo "=== EXTRACTED FILES ==="
          find "$WORK_DIR" -maxdepth 6 -type f | sort | head -400

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          WORK_DIR="$RUNNER_TEMP/smartalert-project"
          PROJECT_ROOT=""

          echo "=== SEARCHING ANDROID PROJECT ==="

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -d "$CANDIDATE/app" ] && \
               { [ -f "$CANDIDATE/build.gradle" ] || \
                 [ -f "$CANDIDATE/build.gradle.kts" ]; }; then

              PROJECT_ROOT="$CANDIDATE"
              break
            fi

          done < <(
            find "$WORK_DIR" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo
            echo "ERROR: Android project root not found."
            echo
            echo "=== PROJECT FILES ==="
            find "$WORK_DIR" -type f | sort
            exit 1
          fi

          echo
          echo "=== ANDROID PROJECT ROOT ==="
          echo "$PROJECT_ROOT"

          echo
          echo "=== PROJECT FILES ==="
          ls -la "$PROJECT_ROOT"

          echo
          echo "=== APP DIRECTORY ==="
          ls -la "$PROJECT_ROOT/app"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"
          echo "Project root:"
          echo "$PROJECT_ROOT"
          echo

          if [ -f "settings.gradle.kts" ]; then
            echo "settings.gradle.kts: OK"
          elif [ -f "settings.gradle" ]; then
            echo "settings.gradle: OK"
          else
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          if [ -f "build.gradle.kts" ]; then
            echo "build.gradle.kts: OK"
          elif [ -f "build.gradle" ]; then
            echo "build.gradle: OK"
          else
            echo "ERROR: build.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo
          echo "=== GRADLE VERSION ==="
          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "BUILD DEBUG APK"
          echo "========================================"

          gradle assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "=== SEARCHING BUILT APK ==="

          APK_FILE="$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          echo
          echo "=== APK FOUND ==="
          ls -lh "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartalert-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"
          echo
          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"
          echo
          echo "APK:"
          echo "$APK_FILE"
          echo
          ls -lh "$APK_FILE"
