name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "=== SEARCHING ZIP ==="

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP:"
          echo "$ZIP_FILE"

      - name: Unzip project
        shell: bash
        run: |
          set -e

          WORK_DIR="$RUNNER_TEMP/smartalert-project"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          echo "=== UNZIPPING PROJECT ==="
          echo "ZIP: $ZIP_FILE"
          echo "DEST: $WORK_DIR"

          unzip -q "$ZIP_FILE" -d "$WORK_DIR"

          echo
          echo "=== EXTRACTED FILES ==="
          find "$WORK_DIR" -maxdepth 5 -type f | sort | head -300

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          WORK_DIR="$RUNNER_TEMP/smartalert-project"

          echo "=== SEARCHING ANDROID PROJECT ==="

          PROJECT_ROOT=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE/app/build.gradle" ] || \
               [ -f "$CANDIDATE/app/build.gradle.kts" ]; then

              if [ -f "$CANDIDATE/gradlew" ]; then
                PROJECT_ROOT="$CANDIDATE"
                break
              fi

            fi
          done < <(
            find "$WORK_DIR" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/build/*" \
              | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo
            echo "ERROR: Android project root not found."
            echo
            echo "The ZIP must contain an Android source project."
            echo
            echo "Expected structure:"
            echo "  settings.gradle / settings.gradle.kts"
            echo "  build.gradle / build.gradle.kts"
            echo "  gradlew"
            echo "  app/"
            echo
            echo "=== PROJECT FILES ==="
            find "$WORK_DIR" -type f | sort
            echo
            exit 1
          fi

          echo
          echo "=== ANDROID PROJECT ROOT ==="
          echo "$PROJECT_ROOT"

          echo
          echo "=== PROJECT FILES ==="
          ls -la "$PROJECT_ROOT"

          echo
          echo "=== APP DIRECTORY ==="
          ls -la "$PROJECT_ROOT/app"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=== VERIFY GRADLE PROJECT ==="
          echo "PWD=$(pwd)"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "=== BUILD DEBUG APK ==="

          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          echo "=== SEARCHING BUILT APK ==="

          APK_FILE="$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          echo
          echo "=== APK FOUND ==="
          ls -lh "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartalert-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"
          echo
          echo "Project:"
          echo "$PROJECT_ROOT"
          echo
          echo "APK:"
          echo "$APK_FILE"
          echo
          ls -lh "$APK_FILE"
